<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Café San Martín</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/encabezado.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <header class="encabezado">
        <div class="marca">
            <img src="../img/logo-cafe-san-martin.png" alt="Logo de Café San Martín">
            <span>Café San Martín</span>
        </div>

        <nav class="menu">
            <a href="../index.html">Inicio</a>
            <a href="Catalogo.html">Catálogo</a>
            <a href="Carrito.html">Carrito de compras</a>
            <a href="Cuenta.html" class="activo">Mi cuenta</a>
            <a href="Perfil.html">Mi perfil</a>
            <a href="Contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4"><strong>Crear una Cuenta</strong></h2>
                        
                        <!-- Formulario de Registro -->
                        <form action="#" method="POST">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos" placeholder="Tus apellidos" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" required>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña" required>
                            </div>

                            <div class="form-check mb-4">
                                <input type="checkbox" class="form-check-input" id="terminos" required>
                                <label class="form-check-label text-muted" for="terminos">
                                    Acepto los términos y condiciones del sitio
                                </label>
                            </div>

                            <button type="submit" class="btn w-100 py-2 mb-3" style="background-color: #6f4e37; color: white;">Registrarme</button>
                        </form>

                        <hr class="my-4">

                        <p class="text-center text-muted mb-0">
                            ¿Ya tienes una cuenta? <a href="Cuenta.html" class="text-decoration-none fw-bold" style="color: #6f4e37;">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Café San Martin</p>
    </footer>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Dentro de Registro.html, agrega este script antes de cerrar el body -->
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que la página se recargue por defecto

        const nombre = document.getElementById('nombre').value;
        const apellidos = document.getElementById('apellidos').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Crear un objeto con los datos del usuario y unos pedidos de ejemplo
        const usuario = {
            nombre: nombre,
            apellidos: apellidos,
            email: email,
            password: password,
            pedidos: [
                { id: "ORD-001", fecha: "2026-05-10", total: "12.500 ₡", estado: "Entregado" },
                { id: "ORD-002", fecha: "2026-06-01", total: "8.200 ₡", estado: "En camino" }
            ]
        };

        // Guardar en el localStorage del navegador
        localStorage.setItem('usuarioRegistrado', JSON.stringify(usuario));

        alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
        window.location.href = 'Cuenta.html'; // Redirige al login
    });
</script>
</body>
</html>
