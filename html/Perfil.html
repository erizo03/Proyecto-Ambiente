<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Café San Martín</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>    
       <div class="logo">
            <img src="../images/logo-cafe-san-martin.png" alt="Logo de la empresa">
            Café San Martín
       </div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="Catalogo.html">Catálogo</a></li>
                <li><a href="Carrito.html">Carrito de compras</a></li>
                <li><a href="Cuenta.html" id="nav-cuenta">Mi cuenta</a></li>
                <li><a href="html/Perfil.html">Mi perfil</a></li>
                <li><a href="Contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row">
            <!-- Información del Usuario -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <h3 id="nombre-usuario" class="card-title mb-2">Mi Perfil</h3>
                        <p id="email-usuario" class="text-muted mb-3">correo@ejemplo.com</p>
                        <button id="btn-cerrar-sesion" class="btn btn-outline-danger btn-sm w-100">Cerrar Sesión</button>
                    </div>
                </div>
            </div>

            <!-- Historial de Pedidos -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-4"><strong>Mis Pedidos</strong></h4>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>N° de Pedido</th>
                                        <th>Fecha</th>
                                        <th>Total</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-pedidos">
                                    <!-- Los pedidos se cargarán aquí mediante JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Café San Martin</p>
    </footer>

    <!-- Script para cargar los datos del usuario autenticado -->
    <script>
        // Verificar si hay una sesión activa
        const sesionActiva = JSON.parse(localStorage.getItem('sesionActiva'));

        if (!sesionActiva) {
            // Si no ha iniciado sesión, redirigir al login
            alert('Debes iniciar sesión para ver esta página.');
            window.location.href = 'Cuenta.html';
        } else {
            // Mostrar datos del usuario en pantalla
            document.getElementById('nombre-usuario').textContent = sesionActiva.nombre + ' ' + sesionActiva.apellidos;
            document.getElementById('email-usuario').textContent = sesionActiva.email;
            
            // Cambiar texto del menú superior de "Mi cuenta" a "Perfil"
            document.getElementById('nav-cuenta').textContent = 'Perfil';

            // Cargar los pedidos en la tabla
            const tbody = document.getElementById('tabla-pedidos');
            sesionActiva.pedidos.forEach(pedido => {
                const fila = `
                    <tr>
                        <td><strong>${pedido.id}</strong></td>
                        <td>${pedido.fecha}</td>
                        <td>${pedido.total}</td>
                        <td><span class="badge bg-success">${pedido.estado}</span></td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
        }

        // Botón para cerrar sesión
        document.getElementById('btn-cerrar-sesion').addEventListener('click', function() {
            localStorage.removeItem('sesionActiva'); // Borrar sesión activa
            alert('Has cerrado sesión correctamente.');
            window.location.href = '../index.html';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
