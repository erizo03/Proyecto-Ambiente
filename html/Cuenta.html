<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta | Café San Martín</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Tus estilos personalizados (ajustando la ruta relativa hacia la carpeta css) -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/encabezado.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <header class="encabezado">
        <div class="marca">
            <img src="../images/logo-cafe-san-martin.png" alt="Logo de Café San Martín">
            <span>Café San Martín</span>
        </div>

        <nav class="menu">
            <a href="../index.html">Inicio</a>
            <a href="Catalogo.html">Catálogo</a>
            <a href="Carrito.html">Carrito de compras</a>
            <a href="Cuenta.html" class="activo">Mi cuenta</a>
            <a href="Perfil.html">Mi perfil</a>
            <a href="Contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4"><strong>Iniciar Sesión</strong></h2>
                        
                        <!-- Formulario de Inicio de Sesión -->
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label text-muted" for="rememberMe">Recordarme</label>
                                </div>
                                <a href="#" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
                            </div>

                            <button type="submit" class="btn w-100 py-2 mb-3" style="background-color: #6f4e37; color: white;">Ingresar</button>
                        </form>

                        <hr class="my-4">

                        <p class="text-center text-muted mb-0">
    ¿Aún no tienes una cuenta? <a href="Registro.html" class="text-decoration-none fw-bold" style="color: #6f4e37;">Regístrate aquí</a>
</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Café San Martin</p>
    </footer>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Dentro de Cuenta.html, agrega este script antes de cerrar el body -->
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();

        const emailIngresado = document.getElementById('email').value;
        const passwordIngresado = document.getElementById('password').value;

        // Obtener el usuario guardado en el navegador
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioRegistrado'));

        if (usuarioGuardado && usuarioGuardado.email === emailIngresado && usuarioGuardado.password === passwordIngresado) {
            // Guardar indicador de sesión activa
            localStorage.setItem('sesionActiva', JSON.stringify(usuarioGuardado));
            alert('¡Bienvenido de nuevo, ' + usuarioGuardado.nombre + '!');
            window.location.href = 'Perfil.html'; // Redirige al perfil
        } else {
            alert('Correo o contraseña incorrectos, o usuario no registrado.');
        }
    });
</script>
</body>
</html>
